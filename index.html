<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Interactive Authentication</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">

</head>

<body>
<div id="app">

    <!-- Dark room -->
    <div class="light-rig" id="lightRig">
        <div class="light-source"></div>
        <div class="light-beam"></div>
        <div class="dust" id="dust"></div>
    </div>
    <div class="grain"></div>
    <div class="room-vignette"></div>

    <!-- Attention-grabbing switch -->
    <div class="switch-wrap attention" id="switchWrap" title="Click to turn on the light">
        <div class="switch-glow"></div>
        <div class="switch-card">
            <div class="switch-lever"></div>
        </div>
        <div class="switch-label">TURN ON</div>
    </div>

    <button class="mute-toggle" id="muteToggle" type="button" title="Mute sound" aria-pressed="false">
        <svg id="muteIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 9v6h4l5 5V4L8 9H4Z"/>
            <path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
    </button>

    <!-- Conversational authentication -->
    <main class="chat">

        <div class="message" id="message">
            <div class="message-bubble">
                <div class="message-title" id="messageTitle"></div>
                <div class="message-sub" id="messageSub"></div>
            </div>

            <div class="chat-input" id="inputBox">
                <input
                    id="chatInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Type your name..."
                >
                <button class="eye" id="eyeToggle" type="button" title="Show password" tabindex="-1">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
                <button class="send" id="send" type="button">↑</button>
            </div>

            <div class="typing" id="typing">
                <span></span><span></span><span></span>
            </div>

            <div class="response" id="response"></div>
        </div>
    </main>

    <div class="timer" id="timer">
        <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
        <div class="timer-label" id="timerLabel"></div>
    </div>

    <div class="success" id="success">
        <div class="success-rays"></div>
        <div class="success-card">
            <div class="success-icon">✓</div>
            <h2>You're in.</h2>
            <p id="successText"></p>
        </div>
    </div>
</div>

<script src="js/main.js"></script>

</body>
</html>
